<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Food log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ea5'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="topbar">
      <div class="brand">Food log <span class="brand__client" id="client-name"></span></div>
      <label class="visually-hidden" for="client-select">Client</label>
      <select id="client-select" class="select" hidden></select>
      <a id="export-link" class="link-btn" href="/api/export.csv" download aria-disabled="true" aria-label="Export CSV" title="Download this log as a CSV file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
        <span class="link-btn__text">Export CSV</span>
      </a>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
      <form id="logout-form" method="POST" action="/logout" hidden>
        <button class="icon-btn" type="submit" aria-label="Log out" title="Log out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </form>
    </div>
    <nav class="tabs" role="tablist" aria-label="Dashboard sections">
      <button class="tab" role="tab" type="button" data-view="today" aria-selected="true" aria-controls="view-today">Today</button>
      <button class="tab" role="tab" type="button" data-view="trends" aria-selected="false" aria-controls="view-trends">Trends</button>
      <button class="tab" role="tab" type="button" data-view="foods" aria-selected="false" aria-controls="view-foods">Foods</button>
      <button class="tab" role="tab" type="button" data-view="coach" aria-selected="false" aria-controls="view-coach" id="coach-tab" hidden>Coach</button>
    </nav>
  </header>

  <div class="banner" id="banner" role="status" aria-live="polite" hidden></div>

  <main>
    <section class="view" role="tabpanel" data-view="today" data-active="true" id="view-today" aria-label="Today"></section>
    <section class="view" role="tabpanel" data-view="trends" id="view-trends" aria-label="Trends"></section>
    <section class="view" role="tabpanel" data-view="foods" id="view-foods" aria-label="Foods"></section>
    <section class="view" role="tabpanel" data-view="coach" id="view-coach" aria-label="Coach"></section>
  </main>
</div>
</body>
</html>
