<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Log in · Food log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ea5'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
<script src="/login.js" defer></script>
<style>
  .login-wrap { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 380px; padding: 32px 28px; }
  .login-card h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 6px; }
  .login-card .lead { color: var(--text-muted); margin: 0 0 24px; }
  .login-card .form { gap: 16px; }
  .login-card .btn { width: 100%; }
  .login-error { margin: 0 0 16px; padding: 10px 14px; border-radius: var(--r-md); background: var(--bad-bg); color: var(--bad-text); font-size: 14px; }
</style>
</head>
<body>
<main class="login-wrap">
  <div class="login-card card">
    <h1>Food log</h1>
    <p class="lead">Enter the dashboard password to continue.</p>
    <p class="login-error" id="error" role="alert" hidden></p>
    <form class="form" method="POST" action="/login">
      <div class="field">
        <label for="password">Password</label>
        <input class="text-input" id="password" name="password" type="password" autocomplete="current-password" autofocus required />
      </div>
      <button class="btn btn--primary" type="submit">Log in</button>
    </form>
  </div>
</main>
</body>
</html>
