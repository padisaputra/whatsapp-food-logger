<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>chat mock - photo log</title>
<style>
  :root {
    --bg-light: #e5ddd5;
    --bg-dark: #0b141a;
    --header-light: #008069;
    --header-dark: #202c33;
    --sent-light: #d9fdd3;
    --sent-dark: #005c4b;
    --recv-light: #ffffff;
    --recv-dark: #202c33;
    --text-light: #111b21;
    --text-dark: #e9edef;
    --meta-light: #667781;
    --meta-dark: #8696a0;
    --check-light: #53bdeb;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    margin: 0; padding: 0; width: 390px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body[data-theme="light"] { background: var(--bg-light); }
  body[data-theme="dark"] { background: var(--bg-dark); }

  .status-bar {
    height: 47px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 15px; font-weight: 600;
  }
  body[data-theme="light"] .status-bar { background: var(--header-light); color: #fff; }
  body[data-theme="dark"] .status-bar { background: var(--header-dark); color: #fff; }
  .status-bar .icons { display: flex; align-items: center; gap: 5px; }

  .wa-header {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px 12px 6px;
  }
  body[data-theme="light"] .wa-header { background: var(--header-light); color: #fff; }
  body[data-theme="dark"] .wa-header { background: var(--header-dark); color: #fff; }
  .wa-header .back { font-size: 26px; line-height: 1; padding: 0 4px; }
  .wa-header .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: #25d366;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .wa-header .avatar svg { width: 20px; height: 20px; }
  .wa-header .who { display: flex; flex-direction: column; justify-content: center; line-height: 1.25; }
  .wa-header .name { font-size: 16.5px; font-weight: 600; }
  .wa-header .status { font-size: 12.5px; opacity: 0.85; }
  .wa-header .spacer { flex: 1; }
  .wa-header .acts { display: flex; gap: 20px; padding-right: 6px; font-size: 19px; }

  .chat-area { padding: 10px 14px 14px; min-height: 560px; }

  .day-chip { display: flex; justify-content: center; margin: 6px 0 14px; }
  .day-chip span { font-size: 12.5px; padding: 5px 12px; border-radius: 8px; }
  body[data-theme="light"] .day-chip span { background: #ffffff; color: var(--meta-light); }
  body[data-theme="dark"] .day-chip span { background: #182229; color: var(--meta-dark); }

  .row { display: flex; margin: 3px 0; }
  .row.out { justify-content: flex-end; }
  .row.in { justify-content: flex-start; }

  .bubble {
    max-width: 78%; padding: 6px 8px 7px 9px; border-radius: 8px; position: relative;
    font-size: 14.3px; line-height: 1.35; white-space: pre-wrap;
  }
  .row.out .bubble { border-top-right-radius: 2px; }
  .row.in .bubble { border-top-left-radius: 2px; }
  body[data-theme="light"] .row.out .bubble { background: var(--sent-light); color: var(--text-light); }
  body[data-theme="dark"] .row.out .bubble { background: var(--sent-dark); color: var(--text-dark); }
  body[data-theme="light"] .row.in .bubble { background: var(--recv-light); color: var(--text-light); }
  body[data-theme="dark"] .row.in .bubble { background: var(--recv-dark); color: var(--text-dark); }

  .photo-bubble { padding: 3px; max-width: 72%; }
  .photo-bubble img { width: 100%; display: block; border-radius: 6px; }
  .photo-bubble .meta {
    position: absolute; right: 10px; bottom: 8px; background: rgba(0,0,0,0.42);
    color: #fff !important; padding: 2px 6px; border-radius: 8px; float: none;
  }
  .photo-bubble .meta .check { color: #7fd0ff; }

  .meta {
    display: flex; align-items: center; gap: 3px; justify-content: flex-end;
    font-size: 11px; margin-top: 3px; float: right; margin-left: 8px;
  }
  body[data-theme="light"] .meta { color: var(--meta-light); }
  body[data-theme="dark"] .meta { color: var(--meta-dark); }
  .meta svg { width: 15px; height: 11px; }
  .meta .check { color: var(--check-light); }

  .bubble-text { margin: 0; }

  .input-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-top: -2px; }
  body[data-theme="light"] .input-bar { background: #f0f0f0; }
  body[data-theme="dark"] .input-bar { background: #202c33; }
  .input-bar .pill { flex: 1; border-radius: 20px; padding: 9px 14px; font-size: 14px; }
  body[data-theme="light"] .input-bar .pill { background: #fff; color: #8a8a8a; }
  body[data-theme="dark"] .input-bar .pill { background: #2a3942; color: #8696a0; }
  .input-bar .ic { font-size: 20px; }
  body[data-theme="light"] .input-bar .ic { color: #54656f; }
  body[data-theme="dark"] .input-bar .ic { color: #8696a0; }
</style>
</head>
<body data-theme="light">
  <div class="status-bar">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="5" y="4" width="3" height="8" rx="0.5"/><rect x="10" y="1" width="3" height="11" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l-1.4 1.5A7.1 7.1 0 0 0 8 4.4c-1.9 0-3.6.7-5 1.9L1.6 4.7A9 9 0 0 1 8 2.2z M8 6c1.3 0 2.5.5 3.4 1.3l-1.4 1.5A3 3 0 0 0 8 8.1c-.8 0-1.5.3-2 .8L4.6 7.4A5.1 5.1 0 0 1 8 6z"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="16" height="8" rx="1.3" fill="currentColor"/><rect x="22.5" y="4" width="1.5" height="4" rx="0.7" fill="currentColor"/></svg>
    </span>
  </div>
  <div class="wa-header">
    <span class="back">&#8249;</span>
    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="9.5" r="1" fill="white" stroke="none"/><circle cx="15" cy="9.5" r="1" fill="white" stroke="none"/></svg>
    </div>
    <div class="who">
      <span class="name">Food Logger</span>
      <span class="status">online</span>
    </div>
    <div class="spacer"></div>
    <div class="acts">
      <span>&#128222;</span>
      <span>&#8942;</span>
    </div>
  </div>
  <div class="chat-area" id="chat-area">
    <div class="day-chip"><span>TODAY</span></div>

    <div class="row out">
      <div class="bubble photo-bubble">
        <img src="meal-photo.jpg" alt="pan of chicken, rice and broccoli" />
        <span class="meta">7:20 PM<svg class="check" viewBox="0 0 16 11" fill="none"><path d="M1 5.5 4 8.5 9.5 1.5M6.5 8.5 11 3.5M11 8.5 15 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </div>
    <div class="row in">
      <div class="bubble"><p class="bubble-text">&#8226; chicken and rice stir-fry &#183; 320g &#183; 430 kcal &#183; P34 C48 F9
&#8226; steamed broccoli &#183; 100g &#183; 35 kcal &#183; P3 C7 F0.4

1430 / 2000 kcal (570 left) &#183; P 131/150g (19g left) &#183; C 159/200g &#183; F 24.9/65g</p><span class="meta">7:21 PM</span></div>
    </div>
  </div>
  <div class="input-bar">
    <span class="ic">&#128515;</span>
    <span class="pill">Message</span>
    <span class="ic">&#128247;</span>
    <span class="ic">&#127908;</span>
  </div>
<script>
  var params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
</script>
</body>
</html>
