<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px; height: 640px; overflow: hidden;
    background: #0b141a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap {
    position: relative; width: 1280px; height: 640px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background:
      radial-gradient(circle at 50% 0%, rgba(37,211,102,0.16), transparent 46%),
      #0b141a;
  }
  .mark {
    width: 92px; height: 92px; border-radius: 50%; background: #25d366;
    display: flex; align-items: center; justify-content: center; margin-bottom: 36px;
    box-shadow: 0 18px 50px rgba(37,211,102,0.25);
  }
  .mark svg { width: 48px; height: 48px; }
  h1 {
    color: #f2f5f3; font-size: 56px; font-weight: 700; letter-spacing: -0.01em;
    margin-bottom: 20px;
  }
  .tagline {
    color: #c3cdd3; font-size: 25px; max-width: 760px; line-height: 1.45;
  }
  .tagline b { color: #e9edef; font-weight: 600; }
  .foot {
    position: absolute; bottom: 40px; color: #52636c; font-size: 17px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="9.5" r="1" fill="white" stroke="none"/><circle cx="15" cy="9.5" r="1" fill="white" stroke="none"/></svg>
    </div>
    <h1>whatsapp-food-logger</h1>
    <div class="tagline">Text what you ate or send a photo. Get <b>macros and daily totals</b> back over WhatsApp, self-hosted with no API key.</div>
    <div class="foot">github.com/padisaputra/whatsapp-food-logger</div>
  </div>
</body>
</html>
